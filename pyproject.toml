[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uavvln-platform"
version = "0.1.0"
description = "Protocol-first UAV vision-language navigation platform"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
uavvln = "uavvln.cli:main"

[tool.setuptools.packages.find]
include = ["uavvln*"]
